name: Browser layout checks

on:
  pull_request:
    paths: ['docs/**', 'scripts/check-layout.cjs', '.github/workflows/layout.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check-layout.cjs', '.github/workflows/layout.yml']
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional live origin, such as https://pointvernon.com/; leave empty to test docs/'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright in the runner temporary directory
        run: npm install --prefix "$RUNNER_TEMP/pv-layout" --no-audit --no-fund --ignore-scripts playwright@1.62.1
      - name: Install Chromium and Linux dependencies
        run: '"$RUNNER_TEMP/pv-layout/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Check phone and desktop layouts
        env:
          NODE_PATH: ${{ runner.temp }}/pv-layout/node_modules
          PV_BASE_URL: ${{ inputs.base_url || '' }}
        run: node scripts/check-layout.cjs
      - name: Keep screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point-vernon-layout-${{ github.run_id }}
          path: artifacts/layout/
          retention-days: 7
          if-no-files-found: warn
